name: Sync Articles from Google Sheet

on:
  schedule:
    - cron: '0 * * * *'  # every hour, at minute 0
  workflow_dispatch:  # allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run sheet sync
        run: node scripts/sync-sheet.mjs

      - name: Commit and push if changed
        run: |
          if [ -f .sync-changed ]; then
            rm .sync-changed
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/content/articles public/images
            git commit -m "Auto-publish scheduled articles from Google Sheet"
            git push
          else
            echo "No new articles to publish."
          fi
